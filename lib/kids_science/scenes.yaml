paperclip-float:
  focus: [640, 545]
  zoom: {hook: 1.6, step2: 1.6, step3: 1.0, step4: 1.6, watch: 1.7, observe: 1.7}
  thumb: "Floating metal?!"
  thumb_zoom: 1.4
  thumb_focus: [520, 520]
  observe_caption: "The tissue sinks, but the paper clip floats!"
  parts:
    - {id: bowl, type: container, kind: bowl, x: 640, y: 600, s: 1.2, opaque: true, hidden: true, label: "bowl of water", label_at: [640, 645]}
    - {id: jug, type: pourer, kind: jug, x: 150, y: 590, s: 0.75, color: water, hidden: true}
    - {id: tissue, type: towel, x: 1000, y: 600, s: 0.6, hidden: true, label: "tissue paper", label_at: [1000, 645]}
    - {id: pencil, type: pencil, x: 330, y: 640, s: 0.75, rot: -90, hidden: true, label: "a pencil", label_at: [210, 680]}
    - {id: clipA, type: clip, x: 1150, y: 600, s: 1.3, hidden: true, label: "paper clip", label_at: [1160, 680]}
  beats:
    materials:
      - {at: bowl, show: [bowl, jug]}
      - {at: tissue, show: [tissue]}
      - {at: metal, show: [clipA]}
      - {at: pencil, show: [pencil]}
    step1:
      - {fx: pour, by: jug, into: bowl, at: fill, dur: 5.0, lift: -20, dx: 140, set: {bowl.l0: 0.7}}
    step2:
      - {at: lay, hide: [tissue, jug]}
      - {at: lay, to: "+0.5", set: {bowl.tissue: 1}, sfx: whoosh}
    step3:
      - {fx: move, at: gently, dur: 2.0, set: {clipA.x: 640, clipA.y: 380, clipA.s: 1.0}}
      - {fx: move, at: gently+2.1, dur: 1.4, set: {clipA.y: 476}}
      - {at: gently+3.5, hide: [clipA]}
      - {at: gently+3.5, dur: 0.1, set: {bowl.clip: 1}, sfx: plink}
    step4:
      - {fx: move, at: pencil, dur: 2.0, set: {pencil.x: 590, pencil.y: 420, pencil.rot: 20}}
      - {fx: move, at: push, dur: 1.4, set: {pencil.y: 475}}
      - {at: push+0.4, to: sinks+0.8, set: {bowl.sink: 1}}
    watch:
      - {at: start, dur: 1.2, set: {pencil.x: 330, pencil.y: 640, pencil.rot: -90}}
    observe:
      - {at: paper, to: "+0.5", set: {bowl.dimple: 1}}
    explain: []
  explain:
    lens: skin
    color: water
    anchor: [640, 490]
    from: gently
    to: 0.95
    captions:
      - {title: "Surface tension", sub: "The water's surface acts like a thin stretchy skin."}
      - {at: paper, title: "Metal is more dense", sub: "So a paper clip would normally sink…"}
      - {at: gently, title: "…but the skin holds it up!", sub: "If you set it down gently."}

