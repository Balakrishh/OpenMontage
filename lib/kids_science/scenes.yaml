      - {at: start, hide: [salt]}
    observe: []
    explain: []
  explain:
    lens: ice
    color: water
    anchor: [640, 240]
    from: start
    to: 0.95
    captions:
      - {title: "Salt melts the top", sub: "Salt makes ice melt at a lower temperature."}
      - {at: melting, title: "Melting makes it colder", sub: "It uses up heat."}
      - {at: salt#2, title: "It freezes again", sub: "And traps the string in the ice!"}

oobleck:
  focus: [640, 470]
  zoom: {step3: 1.3, step4: 1.3, observe: 1.4}
  thumb: "Solid or liquid?!"
  thumb_zoom: 1.4
  thumb_focus: [520, 500]
  observe_caption: "Tap fast: solid! Move slowly: liquid!"
  parts:
    - {id: bowl, type: container, kind: bowl, x: 640, y: 600, s: 1.2, opaque: true, hidden: true, label: "mixing bowl", label_at: [640, 645]}
    - {id: starch, type: pourer, kind: box, x: 170, y: 590, s: 1.0, color: [246, 244, 236], hidden: true, label: "cornstarch", label_at: [170, 645]}
    - {id: jug, type: pourer, kind: jug, x: 1060, y: 590, s: 0.75, color: water, hidden: true, label: "water", label_at: [1060, 645]}
    - {id: spoon, type: spoon, x: 1180, y: 690, s: 1.0, hidden: true, label: "spoon", label_at: [1190, 645]}
    - {id: finger, type: finger, x: 640, y: 330, s: 1.0, show: 0}
    - {id: drip, type: drip, x: 640, y: 345, len: 0, show: 0}
  beats:
    materials:
      - {at: mixing, show: [bowl]}
      - {at: cornstarch, show: [starch]}
      - {at: water, show: [jug]}
      - {at: spoon, show: [spoon]}
    step1:
      - {fx: pour, by: starch, into: bowl, at: pour, dur: 5.0, lift: -20, dx: 140, set: {bowl.l0: 0.4, bowl.c0: goo}}
    step2:
      - {fx: pour, by: jug, into: bowl, at: slowly, dur: 4.5, lift: -20, side: -1, dx: 140, set: {bowl.l0: 0.6}}
      - {fx: move, at: slowly+4.6, dur: 1.0, set: {spoon.x: 690, spoon.y: 470, spoon.rot: -40}}
      - {fx: rub, part: spoon, at: slowly+5.6, dur: 2.4, amp: 50, n: 3, set: {bowl.goo: 1}}
      - {fx: move, at: slowly+8.1, dur: 1.0, set: {spoon.x: 1180, spoon.y: 690, spoon.rot: 0}}
    step3:
      - {at: punch, dur: 0.3, set: {finger.show: 1}}
      - {at: punch+0.3, dur: 0.25, set: {finger.y: 488}, sfx: pop}
      - {at: punch+0.55, dur: 0.15, set: {bowl.crack: 1}}
      - {at: punch+0.9, dur: 0.6, set: {finger.y: 360, bowl.crack: 0}}
    step4:
      - {at: slowly, to: scoop, set: {finger.y: 540}}
      - {at: scoop, dur: 1.4, set: {finger.y: 340}}
      - {at: scoop+0.4, dur: 0.6, set: {drip.show: 1}}
      - {at: drip, to: "+2.0", set: {drip.len: 1}}
    watch:
      - {at: start, dur: 0.5, set: {drip.show: 0, drip.len: 0, finger.show: 1, finger.y: 360}}
    observe:
      - {at: tap, dur: 0.25, set: {finger.y: 488}, sfx: pop}
      - {at: tap+0.25, dur: 0.15, set: {bowl.crack: 1}}
      - {at: solid, dur: 0.6, set: {finger.y: 360, bowl.crack: 0}}
      - {at: slowly, dur: 2.0, set: {finger.y: 540}}
      - {at: flows, dur: 1.2, set: {finger.y: 340}}
      - {at: flows+0.6, dur: 0.6, set: {drip.show: 1}}
      - {at: flows, to: "+1.5", set: {drip.len: 1}}
    explain: []
  explain:
    lens: grains
    color: water
    anchor: [640, 470]
    from: hit
    to: jam
    captions:
      - {title: "Grains in water", sub: "Tiny cornstarch grains floating in water."}
      - {at: slowly, title: "Push slowly: it flows", sub: "The grains slide past each other."}
      - {at: hit, title: "Hit fast: it jams", sub: "The grains lock together like a solid!"}

sunset-glass:
  focus: [660, 430]
  thumb: "Sunset in a glass!"
  observe_caption: "Side: a little blue. Straight through: orange!"
  parts:
    - {id: room, type: dark, amount: 0}
    - {id: beam1, type: beam, x: 300, y: 430, x2: 640, y2: 430, on: 0, spread0: 16, spread: 50}
    - {id: beam2, type: beam, x: 640, y: 430, x2: 1180, y2: 430, on: 0, spread0: 50, spread: 70, color: [255, 246, 200]}
    - {id: blueglow, type: glow, x: 640, y: 440, r: 120, color: [120, 170, 255], show: 0}
    - {id: orangeglow, type: glow, x: 1120, y: 430, r: 70, color: [255, 150, 60], show: 0}
    - {id: glass, type: container, kind: glass, x: 640, y: 600, s: 1.0, hidden: true, label: "clear glass", label_at: [640, 645]}
    - {id: jug, type: pourer, kind: jug, x: 890, y: 590, s: 0.75, color: water, hidden: true, label: "water", label_at: [890, 645]}
