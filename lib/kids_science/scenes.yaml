# Code-drawn scenes for Quick Science (see lib/kids_science/stage.py).
#
# parts:  everything on the table; `hidden: true` parts pop in when named.
# beats:  per beat, actions that start on a narration word (`at`), lasting
#         until `to` or for `dur` seconds. `word+1.5` = 1.5 s after the word,
#         `+1.0` = 1 s after the line ends, a number = fraction of the beat.
# fx:     pour | drops | sprinkle | move | drip | clock (plain `set` otherwise)
# Text on screen always comes from the experiment library; only short
# captions (observe_caption, explain captions, thumb) are written here.

walking-water:
  focus: [590, 430]
  thumb: "Water that climbs?!"
  observe_caption: "Red and yellow meet in the middle and make orange!"
  parts:
    - {id: dropR, type: dropper, x: 90, y: 590, s: 0.85, color: red, hidden: true, label: "red", label_at: [90, 645]}
    - {id: dropY, type: dropper, x: 175, y: 590, s: 0.85, color: yellow, hidden: true, label: "yellow", label_at: [175, 680]}
    - {id: cupL, type: container, kind: cup, x: 290, y: 590, hidden: true, label: "3 clear cups", label_at: [590, 250]}
    - {id: cupM, type: container, kind: cup, x: 610, y: 590, hidden: true}
    - {id: cupR, type: container, kind: cup, x: 900, y: 590, hidden: true}
    - {id: stripL, type: strip, color: red, shown: 0, points: [[365, 565], [390, 295], [470, 220], [535, 295], [565, 565]]}
    - {id: stripR, type: strip, color: yellow, shown: 0, points: [[815, 565], [790, 295], [710, 220], [645, 295], [615, 565]]}
    - {id: towel1, type: towel, x: 1060, y: 680, long: true, hidden: true, label: "2 paper towels", label_at: [1150, 640]}
    - {id: towel2, type: towel, x: 1230, y: 700, long: true, hidden: true}
    - {id: jug, type: pourer, kind: jug, x: 1150, y: 590, s: 0.7, color: water, hidden: true, label: "water", label_at: [1150, 250]}
  beats:
    materials:
      - {at: cups, show: [cupL, cupM, cupR], stagger: 0.15}
      - {at: water, show: [jug]}
      - {at: red, show: [dropR]}
      - {at: yellow, show: [dropY]}
      - {at: paper, show: [towel1, towel2], stagger: 0.2}
    step1:
      - {fx: move, at: line, dur: 2.4, set: {cupL.x: 330, cupM.x: 590, cupR.x: 850}}
    step2:
      - {fx: pour, by: jug, into: cupL, at: fill, dur: 4.2, set: {cupL.l0: 0.7}}
      - {fx: pour, by: jug, into: cupR, at: fill+4.4, dur: 4.2, set: {cupR.l0: 0.7}}
    step3:
      - {fx: drops, by: dropR, into: cupL, at: red, dur: 4.0, set: {cupL.c0: red}}
      - {fx: drops, by: dropY, into: cupR, at: yellow+1.5, dur: 4.0, set: {cupR.c0: yellow}}
    step4:
      - {at: fold, dur: 2.6, set: {towel1.fold: 1, towel2.fold: 1}, sfx: whoosh}
    step5:
      - {at: put, hide: [towel1, towel2]}
      - {at: end, dur: 2.4, set: {stripL.shown: 1}, sfx: whoosh}
      - {at: other, dur: 2.4, set: {stripR.shown: 1}, sfx: whoosh}
    step6:
      - {fx: clock, at: wait, to: "+2.4", minutes: 60, set: {}}
      - {at: wait, to: "+2.4", set: {stripL.wick: 0.55, stripR.wick: 0.55}}
    watch:
      - {at: start, to: 1.0, set: {stripL.wick: 1, stripR.wick: 1}}
    observe:
      - {fx: drip, into: cupM, at: drips, to: orange+1.0, from: [[565, 520], [615, 520]], colors: [red, yellow], every: 0.6}
      - {at: drips, to: orange+1.2, set: {cupM.l0: 0.32, cupM.c0: orange, cupL.l0: 0.62, cupR.l0: 0.62}}
    explain: []
  explain:
    lens: fibers
    color: red
    anchor: [470, 220]
    from: water
    to: "gaps#2"
    captions:
      - {title: "Tiny fibers, tiny gaps", sub: "Water sticks to the fibers and to itself."}
      - {at: capillary, title: "Capillary action!", sub: "Water climbs through tiny spaces."}

fizzy-volcano:
  focus: [640, 400]
  thumb: "Foam volcano!"
  observe_caption: "Red foam bubbles up and spills onto the tray!"
  parts:
    - {id: tray, type: tray, x: 640, y: 600, w: 600, hidden: true, label: "a tray", label_at: [640, 650]}
    - {id: bottle, type: container, kind: bottle, x: 130, y: 590, s: 1.0, hidden: true, label: "small bottle", label_at: [130, 645]}
    - {id: soda, type: pourer, kind: box, x: 290, y: 590, s: 1.0, color: white, hidden: true, label: "baking soda", label_at: [290, 680]}
    - {id: spoon, type: spoon, x: 330, y: 690, s: 1.0, rot: 0, heap: 0, color: white, hidden: true}
    - {id: vinegar, type: pourer, kind: bottle, x: 990, y: 590, s: 1.1, color: vinegar, hidden: true, label: "vinegar", label_at: [990, 645]}
    - {id: soap, type: pourer, kind: jar, x: 1105, y: 590, s: 0.9, color: soap, hidden: true, label: "dish soap", label_at: [1105, 680]}
    - {id: dropR, type: dropper, x: 1215, y: 590, s: 1.05, color: red, hidden: true, label: "red coloring", label_at: [1200, 645]}
  beats:
    materials:
      - {at: small, show: [bottle]}
      - {at: baking, show: [soda, spoon], stagger: 0.2}
      - {at: vinegar, show: [vinegar]}
      - {at: dish, show: [soap]}
      - {at: red, show: [dropR]}
      - {at: tray, show: [tray]}
    step1:
      - {fx: move, at: stand, dur: 2.4, set: {bottle.x: 640, bottle.y: 580}}
    step2:
      - {at: spoon, dur: 0.3, set: {spoon.heap: 1}}
      - {fx: sprinkle, by: spoon, into: bottle, at: spoon, dur: 4.0, lift: 30, tilt: 70, dx: 30, set: {spoon.heap: 0, bottle.l0: 0.07, bottle.c0: white}}
      - {at: spoon+4.2, dur: 0.3, set: {spoon.heap: 1}}
      - {fx: sprinkle, by: spoon, into: bottle, at: spoon+4.3, dur: 4.0, lift: 30, tilt: 70, dx: 30, set: {spoon.heap: 0, bottle.l0: 0.14}}
    step3:
      - {fx: pour, by: soap, into: bottle, at: squirt, dur: 4.0, lift: -30, dx: 95, tilt: 60, set: {bottle.l1: 0.04, bottle.c1: soap}}
      - {fx: drops, by: dropR, into: bottle, at: squirt+4.4, dur: 4.0, lift: 10, cloud: false, set: {bottle.c1: red}}
    step4:
      - {fx: pour, by: vinegar, into: bottle, at: pour, dur: 4.5, lift: -20, dx: 100, tilt: 60, set: {bottle.l2: 0.3, bottle.c2: foam, bottle.fizz: 0.6}}
      - {at: step, dur: 1.5, set: {bottle.foam: 0.25}, sfx: fizz}
    watch:
      - {at: start, to: 1.0, set: {bottle.foam: 0.45, bottle.fizz: 1}, sfx: fizz}
    observe:
      - {at: red, to: tray+0.8, set: {bottle.foam: 1}, sfx: fizz}
    explain: []
  explain:
    lens: bubbles
    color: red
    anchor: [640, 305]
    from: start
    to: 0.9
    captions:
      - {title: "Acid meets base", sub: "Vinegar is an acid. Baking soda is a base."}
      - {at: gas, title: "Carbon dioxide!", sub: "They react and make a new gas: bubbles!"}
      - {at: soap, title: "Soap traps the bubbles", sub: "...into a thick foam."}

density-tower:
  focus: [640, 400]
  thumb: "4 liquids, 1 glass!"
  observe_caption: "Four layers that don't mix!"
  parts:
    - {id: glass, type: container, kind: glass, x: 640, y: 590, s: 1.15, hidden: true, label: "tall glass", label_at: [640, 645]}
    - {id: honey, type: pourer, kind: jar, x: 150, y: 590, s: 0.9, color: honey, hidden: true, label: "honey", label_at: [150, 645]}
    - {id: soap, type: pourer, kind: jar, x: 300, y: 590, s: 0.9, color: soap, hidden: true, label: "dish soap", label_at: [300, 680]}
    - {id: mix, type: container, kind: cup, x: 960, y: 590, s: 0.5, l0: 0.6, hidden: true, label: "water", label_at: [960, 645]}
    - {id: bluecup, type: pourer, kind: jug, x: 960, y: 590, s: 0.6, color: blue, hidden: true}
    - {id: dropB, type: dropper, x: 1080, y: 590, s: 0.95, color: blue, hidden: true, label: "blue coloring", label_at: [1080, 680]}
    - {id: oil, type: pourer, kind: bottle, x: 1200, y: 590, s: 1.0, color: oil, hidden: true, label: "oil", label_at: [1200, 645]}
    - {id: tHoney, type: tag, text: "honey", x: 330, y: 525, to: [570, 550], hidden: true}
    - {id: tSoap, type: tag, text: "soap", x: 330, y: 455, to: [570, 480], hidden: true}
    - {id: tWater, type: tag, text: "blue water", x: 950, y: 380, to: [715, 405], hidden: true}
    - {id: tOil, type: tag, text: "oil", x: 950, y: 300, to: [715, 330], hidden: true}
  beats:
    materials:
      - {at: tall, show: [glass]}
      - {at: honey, show: [honey]}
      - {at: dish, show: [soap]}
      - {at: water, show: [mix]}
      - {at: blue, show: [dropB]}
      - {at: vegetable, show: [oil]}
    step1:
      - {fx: pour, by: honey, into: glass, at: pour, dur: 4.5, lift: -40, dx: 95, set: {glass.l0: 0.2, glass.c0: honey}}
    step2:
      - {fx: pour, by: soap, into: glass, at: slowly, dur: 4.5, lift: -40, dx: 95, set: {glass.l1: 0.2, glass.c1: soap}}
    step3:
      - {fx: drops, by: dropB, into: mix, at: mix, dur: 4.0, lift: 10, set: {mix.c0: blue}}
    step4:
      - {at: slowly, hide: [mix]}
      - {at: slowly, show: [bluecup]}
      - {fx: pour, by: bluecup, into: glass, at: slowly+0.5, dur: 4.5, lift: -40, dx: 110, set: {glass.l2: 0.2, glass.c2: blue}}
    step5:
      - {fx: pour, by: oil, into: glass, at: slowly, dur: 4.5, lift: -40, dx: 95, set: {glass.l3: 0.2, glass.c3: oil}}
    watch:
      - {at: start, hide: [honey, soap, bluecup, dropB, oil, mix]}
    observe:
      - {at: honey, show: [tHoney]}
      - {at: soap, show: [tSoap]}
      - {at: blue, show: [tWater]}
      - {at: oil, show: [tOil]}
    explain: []
  explain:
    lens: particles
    color: honey
    anchor: [640, 540]
    from: start
    to: 0.3
    captions:
      - {title: "Density", sub: "How much stuff is packed into a space."}
      - {at: more, title: "More dense sinks", sub: "Less dense floats on top."}
      - {at: honey, title: "Honey: most dense", sub: "Oil: least dense, so it floats on top."}

floating-egg:
  focus: [640, 400]
  thumb: "Can an egg float?!"
  observe_caption: "Plain water: sinks. Salty water: floats!"
  parts:
    - {id: plain, type: container, kind: glass, x: 420, y: 590, s: 1.1, l0: 0.5, hidden: true}
    - {id: egg2, type: egg, x: 420, y: 580, s: 1.0, hidden: true}
    - {id: glass, type: container, kind: glass, x: 640, y: 590, s: 1.1, hidden: true, label: "tall glass", label_at: [640, 645]}
    - {id: egg, type: egg, x: 1000, y: 590, s: 1.0, hidden: true, label: "an egg", label_at: [1000, 645]}
    - {id: jug, type: pourer, kind: jug, x: 170, y: 590, s: 0.75, color: water, hidden: true, label: "water", label_at: [170, 645]}
    - {id: salt, type: shaker, kind: salt, x: 1130, y: 590, s: 1.0, hidden: true, label: "salt", label_at: [1130, 645]}
    - {id: spoon, type: spoon, x: 1060, y: 690, s: 1.0, hidden: true, label: "a spoon", label_at: [1180, 690]}
    - {id: tPlain, type: tag, text: "plain water", x: 420, y: 168, hidden: true}
    - {id: tSalty, type: tag, text: "very salty water", x: 860, y: 168, hidden: true}
  beats:
    materials:
      - {at: tall, show: [glass]}
      - {at: water, show: [jug]}
      - {at: egg, show: [egg]}
      - {at: salt, show: [salt]}
      - {at: spoon, show: [spoon]}
    step1:
      - {fx: pour, by: jug, into: glass, at: fill, dur: 4.5, set: {glass.l0: 0.5}}
    step2:
      - {fx: move, at: gently, dur: 1.6, set: {egg.x: 640, egg.y: 200, spoon.x: 680, spoon.y: 205}}
      - {fx: move, at: gently+1.8, dur: 2.6, set: {egg.y: 582, spoon.y: 380}}
      - {fx: move, at: gently+4.6, dur: 1.2, set: {spoon.x: 1060, spoon.y: 690}}
    step3:
      - {fx: move, at: take, dur: 2.4, set: {egg.x: 1000, egg.y: 590}}
      - {fx: sprinkle, by: salt, into: glass, at: stir, dur: 4.0, lift: 40, tilt: 150, set: {glass.milky: 0.25}}
      - {fx: move, at: stir+4.2, dur: 1.2, set: {spoon.x: 690, spoon.y: 330, spoon.rot: -40}}
      - {at: stir+5.4, dur: 2.0, set: {spoon.x: 620}, sfx: bubbles}
      - {fx: move, at: stir+7.4, dur: 1.2, set: {spoon.x: 1060, spoon.y: 690, spoon.rot: 0}}
    step4:
      - {fx: move, at: gently, dur: 1.6, set: {egg.x: 640, egg.y: 200}}
      - {fx: move, at: gently+1.8, dur: 3.0, set: {egg.y: 455}}
    watch:
      - {at: start, hide: [jug, salt, spoon]}
    observe:
      - {fx: move, at: plain, dur: 1.4, set: {glass.x: 860, egg.x: 860}}
      - {at: plain, show: [plain, egg2, tPlain]}
      - {at: salty, show: [tSalty]}
    explain: []
  explain:
    lens: particles
    color: water
    anchor: [860, 440]
    from: start
    to: 0.4
    captions:
      - {title: "Sink or float?", sub: "More dense than water sinks. Less dense floats."}
      - {at: dissolving, title: "Salt makes water denser", sub: "Now the egg floats!"}

dancing-raisins:
  focus: [640, 400]
  thumb: "Dancing raisins!"
  observe_caption: "Sink… float up… sink again!"
  parts:
    - {id: glass, type: container, kind: glass, x: 640, y: 590, s: 1.2, hidden: true, label: "tall glass", label_at: [640, 645]}
    - {id: raisins, type: raisins, x: 640, y: 590, top: 300, n: 6, dance: 0, show: 0}
    - {id: fizzy, type: pourer, kind: bottle, x: 220, y: 590, s: 1.1, color: fizzy, hidden: true, label: "fizzy water", label_at: [220, 645]}
    - {id: bowl, type: container, kind: bowl, x: 1030, y: 590, s: 0.45, hidden: true, label: "raisins", label_at: [1030, 645]}
    - {id: pile, type: raisins, x: 1030, y: 585, top: 560, n: 4, dance: 0, show: 0}
  beats:
    materials:
      - {at: tall, show: [glass]}
      - {at: fizzy, show: [fizzy]}
      - {at: raisins, show: [bowl]}
      - {at: raisins, dur: 0.5, set: {pile.show: 1}}
    step1:
      - {fx: pour, by: fizzy, into: glass, at: pour, dur: 4.5, lift: -30, dx: 100, set: {glass.l0: 0.75, glass.c0: fizzy, glass.fizz: 0.6}}
    step2:
      - {at: drop, dur: 0.5, set: {pile.show: 0}}
      - {at: drop, dur: 1.2, set: {raisins.show: 1}, sfx: plink}
    step3:
      - {fx: clock, at: watch, to: "+2.2", minutes: 3}
      - {at: watch, to: "+2.2", set: {raisins.dance: 0.5}}
    watch:
      - {at: start, to: 1.0, set: {raisins.dance: 1, glass.fizz: 0.8}}
    observe: []
    explain: []
  explain:
    lens: bubbles
    color: water
    anchor: [640, 420]
    from: start
    to: 0.9
    captions:
      - {title: "Carbon dioxide bubbles", sub: "Fizzy water is full of them."}
      - {at: bubbles#2, title: "Tiny balloons!", sub: "Bubbles stick to the raisins and lift them."}
      - {at: top, title: "Pop!", sub: "The bubbles pop and the raisins sink again."}

lava-lamp:
  focus: [640, 400]
  thumb: "DIY lava lamp!"
  thumb_zoom: 1.05
  thumb_focus: [560, 470]
  observe_caption: "Blue blobs rise… and sink… again and again!"
  parts:
    - {id: bottle, type: container, kind: bottle, x: 640, y: 590, s: 1.2, hidden: true, label: "clear bottle", label_at: [640, 645]}
    - {id: tab, type: tablet, x: 1180, y: 600, s: 1.2, hidden: true, label: "fizzy tablet", label_at: [1180, 645]}
    - {id: jug, type: pourer, kind: jug, x: 170, y: 590, s: 0.75, color: water, hidden: true, label: "water", label_at: [170, 645]}
    - {id: oil, type: pourer, kind: bottle, x: 330, y: 590, s: 1.0, color: oil, hidden: true, label: "vegetable oil", label_at: [330, 680]}
    - {id: dropB, type: dropper, x: 1030, y: 590, s: 1.0, color: blue, hidden: true, label: "blue coloring", label_at: [1030, 680]}
  beats:
    materials:
      - {at: clear, show: [bottle]}
      - {at: water, show: [jug]}
      - {at: vegetable, show: [oil]}
      - {at: blue, show: [dropB]}
      - {at: fizzy, show: [tab]}
    step1:
      - {fx: pour, by: jug, into: bottle, at: fill, dur: 4.5, lift: -20, set: {bottle.l0: 0.25}}
    step2:
      - {fx: pour, by: oil, into: bottle, at: fill, dur: 5.0, lift: -30, dx: 90, set: {bottle.l1: 0.62, bottle.c1: oil}}
    step3:
      - {fx: drops, by: dropB, into: bottle, at: add, dur: 4.5, lift: 10, cloud: false, set: {bottle.c0: blue}}
    step4:
      - {fx: move, at: drop, dur: 1.6, set: {tab.x: 640, tab.y: 190}}
      - {fx: move, at: drop+1.8, dur: 1.6, set: {tab.y: 570}}
      - {at: drop+3.4, dur: 1.5, set: {bottle.fizz: 0.7, tab.show: 0.6}, sfx: fizz}
    watch:
      - {at: start, to: 1.0, set: {bottle.blobs: 0.5, tab.show: 0.3}}
    observe:
      - {at: blue, to: 0.5, set: {bottle.blobs: 1}, sfx: fizz}
    explain: []
  explain:
    lens: bubbles
    color: blue
    anchor: [640, 420]
    from: start
    to: 0.9
    captions:
      - {title: "Oil and water don't mix", sub: "Oil is less dense, so it floats on top."}
      - {at: food, title: "Color mixes with water", sub: "So it sinks down into the water."}
      - {at: fizzy, title: "Carbon dioxide!", sub: "Bubbles carry blobs of colored water up."}

rainbow-milk:
  focus: [640, 545]
  zoom: {hook: 1.6, step2: 1.6, step3: 1.0, step4: 1.6, watch: 1.7, observe: 1.7}
  thumb: "Magic milk colors!"
  thumb_zoom: 1.5
  thumb_focus: [520, 520]
  observe_caption: "The colors burst outward and swirl!"
  parts:
    - {id: plate, type: container, kind: plate, x: 640, y: 610, sh: 1.6, hidden: true, label: "shallow plate", label_at: [640, 645]}
    - {id: milk, type: pourer, kind: jug, x: 150, y: 590, s: 0.75, color: milk, hidden: true, label: "whole milk", label_at: [150, 645]}
    - {id: dropR, type: dropper, x: 940, y: 590, s: 0.9, color: red, hidden: true, label: "red", label_at: [940, 645]}
    - {id: dropB, type: dropper, x: 1030, y: 590, s: 0.9, color: blue, hidden: true, label: "blue", label_at: [1030, 680]}
    - {id: dropY, type: dropper, x: 1120, y: 590, s: 0.9, color: yellow, hidden: true, label: "yellow", label_at: [1120, 645]}
    - {id: soapdish, type: container, kind: bowl, x: 1215, y: 600, s: 0.3, l0: 0.7, c0: soap, opaque: true, hidden: true, label: "dish soap", label_at: [1215, 680]}
    - {id: swab, type: swab, x: 300, y: 600, rot: 75, color: soap, hidden: true, label: "cotton swab", label_at: [300, 680]}
  beats:
    materials:
      - {at: shallow, show: [plate]}
      - {at: whole, show: [milk]}
      - {at: red, show: [dropR]}
      - {at: blue, show: [dropB]}
      - {at: yellow, show: [dropY]}
      - {at: dish, show: [soapdish]}
      - {at: cotton, show: [swab]}
    step1:
      - {fx: pour, by: milk, into: plate, at: pour, dur: 5.0, lift: -60, dx: 150, set: {plate.milk: 1}}
    step2:
      - {fx: drops, by: dropR, into: plate, at: red, dur: 2.6, lift: 25, n: 2, cloud: false, set: {plate.dots: 0.34}}
      - {fx: drops, by: dropB, into: plate, at: red+2.7, dur: 2.6, lift: 25, n: 2, cloud: false, set: {plate.dots: 0.67}}
      - {fx: drops, by: dropY, into: plate, at: red+5.4, dur: 2.6, lift: 25, n: 2, cloud: false, set: {plate.dots: 1}}
    step3:
      - {fx: move, at: dip, dur: 1.6, set: {swab.x: 1215, swab.y: 520, swab.rot: 0}}
      - {fx: move, at: dip+1.7, dur: 1.0, set: {swab.y: 575, swab.dipped: 1}}
      - {fx: move, at: dip+2.8, dur: 1.0, set: {swab.y: 470}}
    step4:
      - {fx: move, at: touch, dur: 2.0, set: {swab.x: 640, swab.y: 410}}
      - {fx: move, at: touch+2.1, dur: 1.0, set: {swab.y: 545}}
    watch:
      - {at: start, hide: [milk, dropR, dropB, dropY, soapdish]}
    observe:
      - {at: burst, to: swirl+1.5, set: {plate.burst: 1}, sfx: whoosh}
    explain: []
  explain:
    lens: skin
    color: water
    anchor: [640, 540]
    from: soap
    to: edges
    captions:
      - {title: "Surface tension", sub: "Milk's surface acts like a thin stretchy skin."}
      - {at: soap, title: "Soap weakens the skin", sub: "The surface pulls away and carries the colors."}
      - {at: fat, title: "Soap grabs the fat", sub: "That keeps the milk swirling."}

pepper-scatter:
  focus: [640, 545]
  zoom: {hook: 1.6, step2: 1.6, step3: 1.0, step4: 1.6, watch: 1.7, observe: 1.7}
  thumb: "Pepper runs away!"
  thumb_zoom: 1.4
  thumb_focus: [520, 520]
  observe_caption: "The pepper rushes to the edges!"
  parts:
    - {id: bowl, type: container, kind: bowl, x: 640, y: 600, s: 1.2, opaque: true, hidden: true, label: "shallow bowl", label_at: [640, 645]}
    - {id: jug, type: pourer, kind: jug, x: 150, y: 590, s: 0.75, color: water, hidden: true, label: "water", label_at: [150, 645]}
    - {id: pepper, type: shaker, kind: pepper, x: 1000, y: 590, s: 1.0, hidden: true, label: "black pepper", label_at: [1000, 645]}
    - {id: soapdish, type: container, kind: bowl, x: 1150, y: 600, s: 0.3, l0: 0.7, c0: soap, opaque: true, hidden: true, label: "dish soap", label_at: [1150, 680]}
    - {id: swab, type: swab, x: 300, y: 600, rot: 75, color: soap, hidden: true, label: "cotton swab", label_at: [300, 680]}
  beats:
    materials:
      - {at: shallow, show: [bowl]}
      - {at: water, show: [jug]}
      - {at: ground, show: [pepper]}
      - {at: dish, show: [soapdish]}
      - {at: cotton, show: [swab]}
    step1:
      - {fx: pour, by: jug, into: bowl, at: fill, dur: 5.0, lift: -20, dx: 140, set: {bowl.l0: 0.7}}
    step2:
      - {fx: sprinkle, by: pepper, into: bowl, at: sprinkle, dur: 5.0, lift: 40, tilt: 150, color: [40, 35, 30], set: {bowl.specks: 1}}
    step3:
      - {fx: move, at: dip, dur: 1.6, set: {swab.x: 1150, swab.y: 520, swab.rot: 0}}
      - {fx: move, at: dip+1.7, dur: 1.0, set: {swab.y: 575, swab.dipped: 1}}
      - {fx: move, at: dip+2.8, dur: 1.0, set: {swab.y: 470}}
    step4:
      - {fx: move, at: touch, dur: 2.0, set: {swab.x: 640, swab.y: 380}}
      - {fx: move, at: touch+2.1, dur: 1.0, set: {swab.y: 486}}
    watch:
      - {at: start, hide: [jug, pepper, soapdish]}
    observe:
      - {at: pepper, dur: 0.9, set: {bowl.scatter: 1}, sfx: whoosh}
    explain: []
  explain:
    lens: skin
    color: water
    anchor: [640, 490]
    from: soap
    to: edges
    captions:
      - {title: "Surface tension", sub: "Water's surface acts like a stretchy skin."}
      - {at: soap, title: "Soap weakens the skin", sub: "Right where it touches."}
      - {at: stronger, title: "The edges pull harder", sub: "The floating pepper is carried along."}

