needle-compass:
  focus: [640, 470]
  zoom: {step3: 1.3, step4: 1.5, watch: 1.5, observe: 1.5, hook: 1.4}
  thumb: "DIY compass!"
  thumb_zoom: 1.4
  thumb_focus: [520, 500]
  observe_caption: "It points north and south every time!"
  parts:
    - {id: bowl, type: container, kind: bowl, x: 640, y: 600, s: 1.3, l0: 0.75, opaque: true, hidden: true, label: "bowl of water", label_at: [640, 645]}
    - {id: needle, type: needle, x: 230, y: 660, s: 0.75, hidden: true, label: "sewing needle", label_at: [230, 680]}
    - {id: magnet, type: magnet, x: 1080, y: 590, s: 1.0, hidden: true, label: "magnet", label_at: [1080, 645]}
    - {id: cork, type: cork, x: 1180, y: 600, s: 1.2, needle: 0, pierced: 0, hidden: true, label: "cork", label_at: [1190, 680]}
    - {id: tN, type: tag, text: "N", x: 845, y: 418, hidden: true}
    - {id: tS, type: tag, text: "S", x: 435, y: 418, hidden: true}
  beats:
    materials:
      - {at: sewing, show: [needle]}
      - {at: magnet, show: [magnet]}
      - {at: cork, show: [cork]}
      - {at: bowl, show: [bowl]}
    step1:
      - {fx: move, at: stroke, dur: 1.4, set: {magnet.x: 180, magnet.y: 625}}
      - {fx: rub, part: magnet, at: stroke+1.5, dur: 5.0, amp: 90, n: 5}
      - {fx: move, at: stroke+6.6, dur: 1.2, set: {magnet.x: 1080, magnet.y: 590}}
    step2:
      - {fx: move, at: push, dur: 1.6, set: {cork.x: 230, cork.y: 672}}
      - {at: push+1.7, hide: [needle]}
      - {at: push+1.7, dur: 0.6, set: {cork.pierced: 1, cork.needle: 55}, sfx: pop}
    step3:
      - {fx: move, at: float, dur: 2.0, set: {cork.x: 640, cork.y: 470, cork.s: 1.0}}
      - {at: float+2.1, hide: [cork]}
      - {at: float+2.1, dur: 0.1, set: {bowl.cork: 1, bowl.needle: 55}, sfx: plink}
    step4:
      - {at: turn, to: settle+1.5, set: {bowl.needle: 0}}
