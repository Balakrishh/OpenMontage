    - {id: torch, type: flashlight, x: 260, y: 430, s: 1.0, hidden: true, label: "a flashlight", label_at: [240, 500]}
    - {id: eye, type: eye, x: 640, y: 190, s: 1.0, show: 0}
  beats:
    materials:
      - {at: clear, show: [glass]}
      - {at: water, show: [jug]}
      - {at: milk, show: [dropM]}
      - {at: flashlight, show: [torch]}
      - {at: dark, dur: 1.0, set: {room.amount: 0.5}}
      - {at: dark+1.2, dur: 0.8, set: {room.amount: 0}}
    step1:
      - {fx: pour, by: jug, into: glass, at: fill, dur: 4.5, set: {glass.l0: 0.85}}
    step2:
      - {fx: drops, by: dropM, into: glass, at: stir, dur: 4.0, lift: 10, n: 3, cloud: false, set: {glass.milky: 0.55}}
    step3:
      - {at: dark, dur: 1.5, set: {room.amount: 1}}
      - {at: shine, dur: 1.0, set: {torch.on: 1, beam1.on: 0.8, beam2.on: 0.6}, sfx: pop}
    step4:
      - {at: side, dur: 0.8, set: {eye.show: 1}, sfx: pop}
      - {at: side, dur: 1.2, set: {blueglow.show: 1}}
      - {fx: move, at: straight, dur: 1.8, set: {eye.x: 1120, eye.y: 330}}
      - {at: straight+1.2, dur: 1.2, set: {orangeglow.show: 1, beam2.color: [255, 190, 110]}}
    watch: []
    observe:
      - {at: blue, dur: 0.8, set: {blueglow.r: 140}}
      - {at: orange, dur: 0.8, set: {orangeglow.r: 95, beam2.color: [255, 165, 80]}}
    explain: []
  explain:
    lens: light
    color: water
    anchor: [640, 430]
    from: start
    to: 0.4
    captions:
      - {title: "White light", sub: "A mix of all colors."}
      - {at: tiny, title: "Scattering", sub: "Tiny bits bounce blue light around the most."}
      - {at: air, title: "Same in the sky", sub: "That's why the sky looks blue!"}

bean-sprout:
  focus: [640, 420]
  thumb: "Watch a bean grow!"
  observe_caption: "A root grows down, a shoot grows up!"
  parts:
    - {id: sun, type: glow, x: 1150, y: 120, r: 110, color: [255, 210, 90], show: 0}
