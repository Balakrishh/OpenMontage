    lens: magnet
    color: water
    anchor: [640, 470]
    from: earth
    to: 0.9
    captions:
      - {title: "A weak magnet", sub: "Stroking with a magnet makes the needle a magnet."}
      - {at: earth, title: "Earth is a giant magnet", sub: "A floating magnet lines up with it."}
