# What each experiment's setup LOOKS like at every point — the pictures' plot.
#
# Image models cannot be trusted with exact states ("left cup red, middle cup
# empty"), and their own descriptions of a scene are too vague to check. These
# facts are authored once per experiment and become HARD checks for every
# shot that shows the experiment's materials:
#   materials — the materials beat (laid out, nothing done yet)
#   <n>       — after step n of the experiment's `steps` list (1-based)
#   observe   — the result beat
# Keep each fact short, visual and countable. Max 3 per point.

walking-water:
  materials: ["three clear cups that are all completely empty and dry", "two paper towels lie flat on the table beside the cups"]
  1: ["exactly three clear cups stand in a row", "all three cups are empty"]
  2: ["exactly three clear cups in a row", "the left and right cups hold clear water", "the middle cup is empty"]
  3: ["the left cup holds red water and the right cup holds yellow water", "the middle cup is empty"]
  4: ["the left cup is red, the right cup is yellow, the middle cup is empty", "paper towels are folded into long strips"]
  5: ["paper towel strips bridge from the red cup and the yellow cup into the middle cup", "the middle cup is empty"]
  6: ["paper towel strips bridge from the red cup and the yellow cup into the middle cup", "the middle cup is still empty or almost empty"]
  observe: ["the middle cup holds orange water", "the paper towel strips are colored red and yellow"]

fizzy-volcano:
  materials: ["the plastic bottle is empty and stands on a tray", "no foam anywhere"]
  1: ["a small plastic bottle stands on a tray", "no foam anywhere"]
  2: ["white baking soda powder is in the bottle", "no foam anywhere"]
  3: ["the bottle stands on a tray", "no foam anywhere"]
  4: ["vinegar is being poured into the bottle"]
  observe: ["red foam overflows from the bottle onto the tray"]

static-balloon:
  materials: ["one round balloon", "no balloon is stuck to the wall yet"]
  1: ["one inflated, tied balloon", "the balloon is not on the wall"]
  2: ["the balloon is being rubbed on hair or a wool sweater"]
  3: ["the balloon is held against a plain wall"]
  4: ["the balloon touches the wall"]
  observe: ["the balloon stays on the wall with nobody holding it"]

density-tower:
  materials: ["one tall clear glass that is empty", "the liquids are still in their own containers"]
  1: ["a golden honey layer sits at the bottom of the tall glass", "nothing else is in the glass"]
  2: ["two layers in the glass: honey at the bottom and soap above it"]
  3: ["two layers in the glass: honey and soap", "a separate cup holds blue water"]
  4: ["three layers in the glass: honey, soap, blue water on top"]
  5: ["four layers in the glass: honey, soap, blue water, and yellow oil on top"]
  observe: ["four separate stacked layers, with yellow oil floating on top"]

floating-egg:
  materials: ["one egg outside the glass", "the salt is still in its container"]
  1: ["a tall glass half full of clear water", "the egg is not in the glass"]
  2: ["the egg rests at the bottom of the glass of water"]
  3: ["the egg is out of the glass", "salt is being stirred into the water"]
  4: ["the egg is in the salty water"]
  observe: ["the egg floats in the water, not on the bottom"]

rainbow-milk:
  materials: ["the plate is empty", "no colors are on any plate"]
  1: ["a shallow plate covered with white milk", "no colors in the milk yet"]
  2: ["separate drops of red, blue and yellow sit in the middle of the white milk", "the colors are not swirled"]
  3: ["a cotton swab dipped in dish soap", "the color drops in the milk are not swirled"]
  4: ["the soapy cotton swab touches the middle of the milk"]
  observe: ["the colors burst outward and swirl across the milk"]

pepper-scatter:
  materials: ["the bowl is empty", "no pepper on any water"]
  1: ["a shallow bowl of clear water", "no pepper in the water yet"]
  2: ["black pepper flakes float all over the water surface"]
  3: ["a cotton swab with dish soap", "pepper still covers the water evenly"]
  4: ["the soapy swab touches the middle of the water"]
  observe: ["the pepper has rushed to the edges of the bowl, leaving the middle clear"]

lemon-invisible-ink:
  materials: ["a whole lemon half", "the paper is blank"]
  1: ["lemon juice in a small bowl", "the paper is blank"]
  2: ["a cotton swab writing on white paper with lemon juice"]
  3: ["the white paper looks blank"]
  4: ["a grown-up's hands hold a hair dryer pointed at the paper", "no flame anywhere"]
  observe: ["light brown letters have appeared on the paper"]

colored-celery:
  materials: ["the glasses are empty", "the celery is still green everywhere"]
  1: ["two clear glasses of clear water"]
  2: ["one glass of blue water and one glass of red water"]
  3: ["a celery stalk with leaves stands in each colored glass", "the celery leaves are still green"]
  4: ["the celery leaves are still green"]
  observe: ["the celery leaf edges are tinted blue in one glass and red in the other"]

glass-rainbow:
  materials: ["the glass is empty", "the paper is plain white"]
  1: ["a clear glass filled to the top with water"]
  2: ["the glass of water stands in bright light by a window"]
  3: ["a sheet of white paper is held on the far side of the glass"]
  4: ["a glass of water and a sheet of white paper"]
  observe: ["a small band of rainbow colors shows on the white paper"]

lava-lamp:
  materials: ["the bottle is empty", "the fizzy tablet is still whole and out of the bottle"]
  1: ["a clear bottle about a quarter full of clear water"]
  2: ["a clear bottle with a layer of yellow oil above a layer of water"]
  3: ["blue drops sinking through the oil", "no bubbling yet"]
  4: ["a piece of fizzy tablet dropped into the bottle"]
  observe: ["blue bubbly blobs rise up through the yellow oil"]

candy-rainbow:
  materials: ["the plate is empty and white", "the candies are in a pile or bag"]
  1: ["round colored candies in a circle around the edge of a white plate", "the middle of the plate is dry and white"]
  2: ["warm clear water poured into the middle of the plate touches every candy", "no color stripes yet"]
  3: ["a ring of candies around water on a white plate"]
  observe: ["stripes of color spread from each candy toward the middle"]

balloon-rocket:
  materials: ["a balloon that is not inflated", "the string is not tied to anything"]
  1: ["a drinking straw threaded on a long string"]
  2: ["a long string stretched tight between two chairs, with a straw on it"]
  3: ["an inflated balloon taped under the straw on the string"]
  4: ["the balloon on the string between two chairs"]
  observe: ["the balloon has zoomed along the string away from where it started"]

ice-fishing:
  materials: ["the glass has no ice cube in it", "the string is loose on the table"]
  1: ["one ice cube floats in a clear glass of water"]
  2: ["one end of a string lies across the top of the floating ice cube"]
  3: ["salt sprinkled over the string and the ice cube"]
  4: ["the string is lifted"]
  observe: ["the ice cube hangs from the string above the water"]

dancing-raisins:
  materials: ["the glass is empty", "the raisins are outside the glass"]
  1: ["a tall glass of clear bubbly fizzy water", "no raisins in the glass"]
  2: ["a few raisins in the glass of fizzy water"]
  3: ["raisins in the glass of fizzy water"]
  observe: ["some raisins are floating near the top and some are at the bottom"]

oobleck:
  materials: ["the mixing bowl is empty", "the cornstarch is in its box"]
  1: ["dry white cornstarch powder in a mixing bowl"]
  2: ["thick white goo in the bowl being stirred"]
  3: ["a finger taps the surface of the white goo"]
  4: ["fingers sink into or lift white goo that drips"]
  observe: ["white goo dripping from fingers into the bowl"]

paperclip-float:
  materials: ["the bowl is empty", "the paper clip lies on the table"]
  1: ["a clear bowl of water"]
  2: ["a small square of tissue lies flat on the water"]
  3: ["a paper clip rests on top of the tissue on the water"]
  4: ["a pencil gently pushes the tissue down"]
  observe: ["the paper clip floats on the water surface by itself"]

sunset-glass:
  materials: ["the glass is empty", "the flashlight is off"]
  1: ["a clear glass of clear water"]
  2: ["the water in the glass is slightly cloudy"]
  3: ["a flashlight beam shines through the side of the glass in a dark room"]
  4: ["a dark room with a flashlight shining through a glass of cloudy water"]
  observe: ["the water glows slightly blue from the side and orange looking toward the flashlight"]

bean-sprout:
  materials: ["the zip bag is empty", "the beans are dry"]
  1: ["a damp folded paper towel"]
  2: ["a folded paper towel inside a clear zip bag"]
  3: ["a few beans inside the bag against the paper towel", "no roots yet"]
  4: ["the zip bag taped to a sunny window", "no roots yet"]
  observe: ["the beans have small white roots growing down and green shoots growing up"]

needle-compass:
  materials: ["the needle is not in the cork", "the bowl holds no cork"]
  1: ["a grown-up's hands stroke a needle with a magnet", "no needle near a child's hands"]
  2: ["a needle pushed through a small piece of cork, held by a grown-up"]
  3: ["a small cork with a needle floats in a bowl of still water"]
  4: ["a cork with a needle floats in a bowl of water"]
  observe: ["the needle on the floating cork points in one fixed direction"]
